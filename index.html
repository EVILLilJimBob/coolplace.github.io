<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolPlace</title>
    <style>
        /* Deep space background - soft and dark for eye comfort */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0d1117 0%, #07090e 100%);
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient, soft stars layout */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                white, /* fallback */
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 0);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.15; /* Dimmed down to avoid harsh contrast */
            z-index: 0;
            animation: drift 120s linear infinite;
        }

        /* Subtle background movement for a deep space feel */
        @keyframes drift {
            from { background-position: 0 0, 40px 60px; }
            to { background-position: 550px 1100px, 390px 1110px; }
        }

        /* Header area located at the top middle */
        header {
            width: 100%;
            text-align: center;
            padding-top: 60px;
            z-index: 1;
        }

        /* Soft, non-harsh "CoolPlace" neon text */
        .title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
            /* Using a muted, soft cyan-blue instead of pure blinding white */
            color: #a5d6ff; 
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.3), 
                         0 0 30px rgba(88, 166, 255, 0.1);
        }

        /* Main content container for future elements */
        main {
            max-width: 800px;
            padding: 40px 20px;
            text-align: center;
            z-index: 1;
        }

        .welcome-text {
            font-size: 1.2rem;
            color: #8b949e; /* Dimmer grey text to ease eye strain */
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">CoolPlace</h1>
    </header>

    <main>
        <p class="welcome-text">Explore the quiet cosmos. Rest your eyes and look around.</p>
    </main>

</body>
</html>
